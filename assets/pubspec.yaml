name: yotoqxona
description: University Dormitory Management System
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_storage: ^13.4.2
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  cloud_functions: ^6.3.2
  firebase_messaging: ^16.3.0

  # Supabase
  supabase_flutter: ^2.9.1

  # UI
  google_fonts: ^8.1.0
  flutter_svg: ^2.0.9
  cupertino_icons: ^1.0.6
  provider: ^6.1.1

  flutter_form_builder: ^10.3.0+2
  form_builder_validators: ^11.3.0

  flutter_local_notifications: ^22.0.0

  fl_chart: ^1.2.0

  # Network
  http: ^1.2.0

  # File
  image_picker: ^1.0.5
  file_picker: ^8.1.2
  path: ^1.9.0
  path_provider: ^2.1.6
  open_filex: ^4.5.0

  # Utils
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.1
  share_plus: ^12.0.2
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo/kuhostel_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/kuhostel_logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/logo/kuhostel_logo.png"
    background_color: "#ffffff"
    theme_color: "#0175C2"
  windows:
    generate: true
    image_path: "assets/logo/kuhostel_logo.png"
  macos:
    generate: true
    image_path: "assets/logo/kuhostel_logo.png"